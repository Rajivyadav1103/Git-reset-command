    <h1>git reset command</h1>  
    <p>The git reset command is used to undo changes in the Git repository. It can be used to move the HEAD pointer to a specific commit, effectively changing the current branch's history. The git reset command has three main options: --soft, --mixed, and --hard.</p>
    <h2>git reset --soft</h2>
